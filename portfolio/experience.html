<script>
(function(){
  /* ======================================================================
     EDIT HERE. One row per place you worked.
     [company name, role (optional, '' to hide), period, logo file]
     Put logo files (PNG/SVG, transparent background) in assets/experience/.
     If the logo file is missing, the first letter of the name is shown.
     Rows with ph:true are placeholders: replace the text and delete ph:true.
     ====================================================================== */
  const jobs=[
    {ph:true,name:'Company name',role:'Job title',period:'Mon YYYY – Present',logo:'assets/experience/company-1.png'},
    {ph:true,name:'Company name',role:'Job title',period:'Mon YYYY – Mon YYYY',logo:'assets/experience/company-2.png'},
    {ph:true,name:'Company name',role:'Job title',period:'Mon YYYY – Mon YYYY',logo:'assets/experience/company-3.png'}
  ];
  /* ====================================================================== */
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  $('#exp').innerHTML=jobs.map(j=>`
    <article class="exp-row rv${j.ph?' ph':''}">
      <div class="exp-logo"><img src="${esc(j.logo)}" alt="${esc(j.name)} logo" loading="lazy"><span class="mono-l">${esc(j.name.charAt(0))}</span></div>
      <div class="exp-main"><h2>${esc(j.name)}</h2>${j.role?`<p class="role">${esc(j.role)}</p>`:''}</div>
      <div class="exp-period"><span class="mono">${j.ph?'Placeholder':'Period'}</span><b>${esc(j.period)}</b></div>
    </article>`).join('');
  $$('.exp-logo img').forEach(im=>{
    const bad=()=>im.parentElement.classList.add('noimg');
    im.addEventListener('error',bad);
    if(im.complete&&im.naturalWidth===0)bad();
  });
  observeReveal();
})();
</script>
